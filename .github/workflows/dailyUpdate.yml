name: Daily update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: update notebook
        run: |
          python -m pip install jupyter nbconvert nbformat
          jupyter nbconvert --to notebook --execute report.ipynb

      - name: commit changes
        run: |
          git add report.ipynb
          git commit -m "Daily automated notebook update: $(date +'%Y-%m-%d')" 
          git push
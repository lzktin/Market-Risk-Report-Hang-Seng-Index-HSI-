name: Daily update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      # - name: install dependencies
      #   run: python -m pip install --upgrade pip -r requirements.txt

      - name: update notebook and turn to markdown
        run: |
          jupyter nbconvert --to markdown --execute report.ipynb

      - name: commit changes
        run: |
          git config --local user.email "linzhongkuan1@gmail.com"
          git config --local user.name "lzktin"
          mv report.md README.md
          git add README.md
          git add report_files/*
          git commit -m "Daily automated notebook update: $(date +'%Y-%m-%d')" 
          git push
